name: 课表提醒

# 触发条件：
#  1. 定时：每天在以下时间点各跑两次（双保险）
#       北京 07:40 / 07:50（早八课前）
#       北京 09:30 / 09:40（第二节课前）
#       北京 10:00 / 10:10（周六网课提醒）
#       北京 14:10 / 14:20（下午课前）
#       北京 18:00 / 18:10（考核节点类提醒）
#       北京 20:00 / 20:10（期中/假期提醒）
#       北京 22:00 / 22:10（充电提醒）
#     注意：GitHub schedule cron 在本仓库实测不触发，所以定时主要靠
#         「外部 cron 服务」按下面 schedule 的时刻打 webhook 触发本工作流。
#  2. push 触发：保证改动被调度器登记（防止仓库被 inactive）
#  3. workflow_dispatch：手动触发（用来测试）
#  4. repository_dispatch：外部 cron 服务（cron-job.org 等）发 webhook 来触发
on:
  schedule:
    - cron: '40,50 23 * * *'   # 北京 07:40 / 07:50
    - cron: '30,40 1 * * *'    # 北京 09:30 / 09:40
    - cron: '0,10 2 * * *'     # 北京 10:00 / 10:10
    - cron: '10,20 6 * * *'    # 北京 14:10 / 14:20
    - cron: '0,10 10 * * *'    # 北京 18:00 / 18:10
    - cron: '0,10 12 * * *'    # 北京 20:00 / 20:10
    - cron: '0,10 14 * * *'    # 北京 22:00 / 22:10
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [trigger-reminder]

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch' || github.event.action == 'trigger-reminder'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行提醒脚本
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python reminder.py

      - name: 提交去重状态
        run: |
          git config user.name "reminder-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f sent.json ] && ! git diff --quiet sent.json; then
            git add sent.json
            git commit -m "update sent state"
            git push
          else
            echo "sent.json 无变化，跳过提交"
          fi
