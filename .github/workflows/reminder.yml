name: 课表提醒

# 触发条件：
#  1. 定时：每天在北京时间 07:40/07:50、09:30/09:40、10:00/10:10、14:10/14:20、
#            18:00/18:10、20:00/20:10、22:00/22:10 各跑一次（下面为 UTC 时间）
#     每个提醒给两次机会，避免 GitHub 延迟导致漏发；比每 10 分钟跑更不容易被丢弃
#  2. 代码推送时跑一次（保证工作流被调度器登记，同时验证改动生效）
#  3. 手动触发（用于测试链路）
on:
  schedule:
    - cron: '40,50 23 * * *'   # 北京 07:40 / 07:50（早八课前）
    - cron: '30,40 1 * * *'    # 北京 09:30 / 09:40（第二节课前）
    - cron: '0,10 2 * * *'     # 北京 10:00 / 10:10（周六网课提醒）
    - cron: '10,20 6 * * *'    # 北京 14:10 / 14:20（下午课前）
    - cron: '0,10 10 * * *'    # 北京 18:00 / 18:10（考核节点类提醒）
    - cron: '0,10 12 * * *'    # 北京 20:00 / 20:10（期中/假期提醒）
    - cron: '0,10 14 * * *'    # 北京 22:00 / 22:10（充电提醒）
    # 注意：GitHub 的 schedule 触发在本仓库实测不生效（push / workflow_dispatch 均正常），
    # 若哪天 schedule 恢复，这些定点时间即为每天的提醒检查时刻。
  push:
    branches: [main]
  workflow_dispatch: {}

# 允许提交 sent.json 去重状态
permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行提醒脚本
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python reminder.py

      - name: 提交去重状态
        run: |
          git config user.name "reminder-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f sent.json ] && ! git diff --quiet sent.json; then
            git add sent.json
            git commit -m "update sent state"
            git push
          else
            echo "sent.json 无变化，跳过提交"
          fi
